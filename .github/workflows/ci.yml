name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: bb, POSTGRES_PASSWORD: ci-secret-123, POSTGRES_DB: betitest }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bb" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bb:ci-secret-123@127.0.0.1:5432/betitest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
