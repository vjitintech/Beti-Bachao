name: Android app
# Builds the Beti Bachao Android app (phones + tablets).
#  - Always: a debug APK you can install directly ("android-latest" release on GitHub).
#  - With signing secrets: a signed release APK + Play Store bundle (.aab).
# Optional repository settings:
#   Variables: BB_SERVER_URL (server address baked into the app)
#   Secrets:   GOOGLE_SERVICES_JSON (Firebase, for push alerts)
#              BB_KEYSTORE_BASE64, BB_KEYSTORE_PASSWORD, BB_KEY_ALIAS, BB_KEY_PASSWORD (Play signing)
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'public/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      BB_SERVER_URL: ${{ vars.BB_SERVER_URL }}
      BB_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Bundle app screens
        run: node scripts/prepare-www.mjs
      - name: Generate Android project
        run: npx cap add android
      - name: Add native safety modules
        run: node scripts/patch-android.mjs
      - name: Firebase config (optional)
        env: { GS: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: if [ -n "$GS" ]; then printf '%s' "$GS" > android/app/google-services.json; echo "Firebase configured"; else echo "No GOOGLE_SERVICES_JSON secret — push alerts disabled in this build"; fi
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Build signed release (if keystore secrets are set)
        working-directory: mobile/android
        env:
          KS: ${{ secrets.BB_KEYSTORE_BASE64 }}
          BB_KEYSTORE_PASSWORD: ${{ secrets.BB_KEYSTORE_PASSWORD }}
          BB_KEY_ALIAS: ${{ secrets.BB_KEY_ALIAS }}
          BB_KEY_PASSWORD: ${{ secrets.BB_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then echo "No keystore secret — skipping signed release"; exit 0; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          BB_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Collect outputs
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/debug/app-debug.apk ../dist/BetiBachao-debug.apk
          [ -f android/app/build/outputs/apk/release/app-release.apk ] && cp android/app/build/outputs/apk/release/app-release.apk ../dist/BetiBachao-release.apk || true
          [ -f android/app/build/outputs/bundle/release/app-release.aab ] && cp android/app/build/outputs/bundle/release/app-release.aab ../dist/BetiBachao-release.aab || true
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with: { name: beti-bachao-android, path: dist/ }
      - name: Publish "android-latest" download
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        working-directory: .
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Beti Bachao Android (latest build #${{ github.run_number }})" \
            --notes "Install BetiBachao-debug.apk on an Android phone or tablet (allow 'Install unknown apps'). Server: ${BB_SERVER_URL:-asked on first launch}. Built from ${GITHUB_SHA::7}."
