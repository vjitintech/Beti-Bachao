# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/vjitintech/Beti-Bachao
# Always-on plan + persistent disk are required: a sleeping free server would
# delay an SOS, and without a disk all accounts would be lost on restart.
services:
  - type: web
    name: beti-bachao
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1          # single instance: data lives on the attached disk
    buildCommand: node --version
    startCommand: node server/server.js
    healthCheckPath: /api/v1/health
    disk:
      name: beti-bachao-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_FILE
        value: /var/data/db.json
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: MFA_REQUIRED
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
